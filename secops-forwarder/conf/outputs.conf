# SecOps Forwarder — outputs.conf
# Defines the SecOps backend endpoint and forwarding behavior.

[secops]
# Backend server URL (no trailing slash)
server = http://localhost:8080

# API bearer token — generate from your SecOps Console profile settings
token = YOUR_API_TOKEN_HERE

# Friendly name shown in the SecOps Console Forwarders tab
name = forwarder-1

# Number of events to batch before sending (max: 10,000)
batchSize = 100

# How often to flush the batch even if not full (milliseconds)
flushInterval = 5000

# Maximum retry attempts on transient failures
maxRetries = 5

# Base delay for exponential backoff (milliseconds)
retryBaseMs = 1000

# How often to send a heartbeat to the backend (milliseconds)
heartbeatInterval = 30000
