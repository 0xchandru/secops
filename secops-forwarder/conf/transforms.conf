# SecOps Forwarder — transforms.conf
# Defines regex-based field extractions applied before forwarding.
# Referenced from props.conf TRANSFORMS setting.

[sshd_failed]
# Extract username and source IP from SSH failed login events
REGEX = (?:Failed password|Invalid user)\s+(?:for\s+(?:invalid user\s+)?)?(\S+)\s+from\s+(\S+)
FORMAT = username::$1 src_ip::$2
WRITE_META = false

[sshd_accepted]
# Extract username and source IP from SSH accepted login events
REGEX = Accepted (?:password|publickey) for (\S+) from (\S+)
FORMAT = username::$1 src_ip::$2
WRITE_META = false

[nginx_client_ip]
# Extract client IP, method, URL, and status from NGINX combined log
REGEX = ^(\S+) \S+ \S+ \[.*?\] "(\S+) (\S+) HTTP/[\d.]+" (\d+) (\d+)
FORMAT = src_ip::$1 http_method::$2 http_url::$3 http_status::$4 bytes::$5
WRITE_META = false

[apache_client_ip]
# Apache CLF: extract client IP, method, URL, status code
REGEX = ^(\S+) \S+ \S+ \[.*?\] "(\S+) (\S+) HTTP/[\d.]+" (\d+)
FORMAT = src_ip::$1 http_method::$2 http_url::$3 http_status::$4
WRITE_META = false
