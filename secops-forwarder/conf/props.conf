# SecOps Forwarder — props.conf
# Defines per-sourcetype timestamp extraction and line-breaking rules.
# Stanza name must exactly match the sourcetype in inputs.conf.

[linux_secure]
# TIME_PREFIX marks where the timestamp begins in each event
TIME_PREFIX = \w+\s+\d+\s+
TIME_FORMAT = %H:%M:%S
TRANSFORMS = sshd_failed, sshd_accepted

[syslog]
TIME_PREFIX = \w+\s+\d+\s+
TIME_FORMAT = %H:%M:%S

[nginx]
# Apache/NGINX combined log format
TIME_PREFIX = \[
# TRANSFORMS = nginx_client_ip

[apache]
TIME_PREFIX = \[

[windows_eventlog]
TIME_PREFIX = EventTime=

[json]
# No special timestamp prefix — rely on ISO 8601 auto-detection
