# SecOps Forwarder — inputs.conf
# Defines which files to monitor. Format: [monitor://<path>]
# Paths may contain glob wildcards (* and ?).

# ─── Example: Linux authentication log ───────────────────────────────────────
[monitor:///var/log/auth.log]
sourcetype = linux_secure
index = main
# host = my-server.example.com   # Override hostname (default: system hostname)
# followTail = true               # Start from end-of-file on first run
# disabled = false

# ─── Example: NGINX access log ────────────────────────────────────────────────
[monitor:///var/log/nginx/access.log]
sourcetype = nginx
index = web
disabled = true

# ─── Example: Apache access log ───────────────────────────────────────────────
[monitor:///var/log/apache2/access.log]
sourcetype = apache
index = web
disabled = true

# ─── Example: Multiple log files via glob ─────────────────────────────────────
[monitor:///var/log/syslog]
sourcetype = syslog
index = main
disabled = true

# ─── Example: Application JSON logs ───────────────────────────────────────────
[monitor:///var/log/app/*.log]
sourcetype = json
index = app
disabled = true

# ─── Example: Windows Event Log export (text format) ─────────────────────────
[monitor:///C:/Windows/Logs/Application/Application.log]
sourcetype = windows_eventlog
index = windows
disabled = true
