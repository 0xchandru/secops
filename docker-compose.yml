version: "3.8"

services:
  # ---------- Infrastructure ----------
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secops_pass}
      POSTGRES_DB: ${POSTGRES_DB:-secops}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secops}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------- API Server ----------
  api-server:
    build:
      context: ./secops-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATABASE_URL: postgresql://${POSTGRES_USER:-secops}:${POSTGRES_PASSWORD:-secops_pass}@postgres:5432/${POSTGRES_DB:-secops}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ENABLE_SYSLOG: "false"
      ENABLE_WORKER: "false"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------- Pipeline Worker ----------
  pipeline-worker:
    build:
      context: ./secops-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "--enable-source-maps", "dist/index.mjs"]
    environment:
      NODE_ENV: production
      PORT: "8081"
      DATABASE_URL: postgresql://${POSTGRES_USER:-secops}:${POSTGRES_PASSWORD:-secops_pass}@postgres:5432/${POSTGRES_DB:-secops}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ENABLE_WORKER: "true"
      ENABLE_SYSLOG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------- Syslog Receiver ----------
  syslog-receiver:
    build:
      context: ./secops-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "--enable-source-maps", "dist/index.mjs"]
    environment:
      NODE_ENV: production
      PORT: "8082"
      DATABASE_URL: postgresql://${POSTGRES_USER:-secops}:${POSTGRES_PASSWORD:-secops_pass}@postgres:5432/${POSTGRES_DB:-secops}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ENABLE_SYSLOG: "true"
      ENABLE_WORKER: "false"
      SYSLOG_UDP_PORT: "1514"
      SYSLOG_TCP_PORT: "1514"
    ports:
      - "1514:1514/udp"
      - "1514:1514/tcp"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------- Frontend ----------
  frontend:
    build:
      context: ./secops-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - api-server

volumes:
  pgdata:
  redisdata:
